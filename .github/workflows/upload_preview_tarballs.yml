# Throwaway integration test for the OIDC upload-token exchange in
# vercel-packages. This file keeps the upload_preview_tarballs.yml path because
# vercel-packages matches the job_workflow_ref claim against it; on preview
# deployments the workflow is authorized from any branch, while production only
# authorizes canary.
name: upload-preview-tarballs

on:
  push:
    branches: [sebbie/test-upload-oidc-exchange]
  workflow_dispatch:

permissions:
  contents: read
  # Minting GitHub OIDC tokens to authorize uploads at vercel-packages.
  id-token: write

jobs:
  probe:
    name: Probe upload token exchange
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The probe needs @vercel/blob for the direct-to-store upload. Installing
      # it standalone avoids a full repo install.
      - name: Install @vercel/blob for the probe
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          npm init -y > /dev/null
          npm install @vercel/blob@2.3.3 --no-audit --no-fund

      - name: Run the exchange probe
        run: node scripts/probe-upload-exchange.js
        env:
          NODE_PATH: ${{ runner.temp }}/probe/node_modules
          PREVIEW_DEPLOYMENT_BASE_URL: https://vercel-packages-git-sebbie-upload-oidc-vtest314-next-e2e-tests.vercel.app/next
          PRODUCTION_BASE_URL: https://vercel-packages.vercel.app/next
